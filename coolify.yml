# Configuração específica para Coolify
version: '3.8'

services:
  backend-leia:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend-leia
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
    env_file:
      - .env
    volumes:
      - ./public:/app/public
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - coolify
    labels:
      - "coolify.managed=true"

networks:
  coolify:
    external: true
