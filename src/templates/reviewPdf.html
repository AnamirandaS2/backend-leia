<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ this.title }} - {{ this.name }}</title>
</head>
<body>
    <style>
        * {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
        }

        h1 {
            text-align: center;
            font-size: 16px;
            line-height: 24px;
        }

        h2 {
            text-align: justify;
            font-size: 12px;
            line-height: 18px;
            font-weight: normal;
        }

        p {
            text-align: justify;
            font-size: 12px;
            line-height: 18px;
            text-indent: 25px;
        }

        header {
            margin-bottom: 10px;
        }

        hr {
            border: none;
            border-top: 1px solid rgb(158, 158, 158);
            margin-top: 10px;
            
        }

    </style>
    <header>
        <h1>{{ this.reviewTitle }}</h1>
        <h2>Autoria de: <b>{{ this.name }}</b></p>
        <h2>Resenha baseada no livro <b>{{ this.bookTitle }}</b>, escrito por <b>{{ this.bookAuthor }}</b></p>
        <h2>Data de envio: <b>{{ this.date }}</b></h2>
        <hr/>
    </header>
    <main>
        <p>
            {{ this.content }}
        </p>
    </main>
</body>
</html>
